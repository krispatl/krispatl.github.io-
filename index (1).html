<!DOCTYPE html>
<html lang="en">
<head>
  <title>kris pilcher</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kris Pilcher — artist, technologist, XR creator.">
  <link rel="stylesheet" href="/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #05050d;
    }

    body {
      color: #f0efea;
      font-family: 'Space Grotesk', 'Avenir Next', sans-serif;
      overflow-x: hidden;
    }

    #myVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: saturate(1.05) contrast(1.02);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(5,5,13,0.82) 0%, rgba(5,5,13,0.55) 46%, rgba(5,5,13,0.2) 100%),
        radial-gradient(ellipse 90% 70% at 8% 100%, rgba(5,5,13,0.6), transparent 70%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(860px, calc(100% - 48px));
      min-height: calc(100vh - 68px);
      padding: 34px 24px 48px;
      margin: 0;
      color: #f0efea;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 10vw, 6.4rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-shadow: none;
    }

    .intro {
      max-width: 34rem;
      margin: 0 0 clamp(24px, 5vh, 44px);
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.85;
      color: rgba(240,239,234,0.86);
      border-left: 1px solid #ff3eb5;
      padding-left: 18px;
    }

    .intro .roles {
      display: block;
      margin-bottom: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64f4e0;
    }

    .nav-block { margin-top: 8px; }

    .home-links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 2px 22px;
      max-width: 46rem;
    }

    .home-links a {
      position: relative;
      display: block;
      padding: 0.42rem 0;
      color: rgba(240,239,234,0.9);
      font-family: 'Space Mono', monospace;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid rgba(240,239,234,0.1);
      transition: color 0.2s ease, border-color 0.2s ease, padding-left 0.2s ease;
    }

    .home-links a:hover {
      color: #64f4e0;
      border-bottom-color: rgba(100,244,224,0.5);
      padding-left: 0;
      text-shadow: none;
    }

    .secondary-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 28px;
      margin-top: 26px;
    }

    .secondary-links a {
      color: rgba(240,239,234,0.62);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      border-bottom: 1px solid rgba(240,239,234,0.18);
      padding-bottom: 1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .secondary-links a:hover {
      color: #ff3eb5;
      border-bottom-color: #ff3eb5;
    }

    .note-block {
      margin-top: auto;
      padding-top: clamp(28px, 6vh, 56px);
    }

    .note-block p {
      max-width: 34rem;
      margin: 0;
      color: rgba(240,239,234,0.6);
      line-height: 1.75;
      font-size: 0.88rem;
      font-weight: 300;
    }

    a:focus-visible {
      outline: 2px solid #64f4e0;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .top-strip .dot { animation: none; }
    }

    @media (max-width: 700px) {
      .content {
        width: 100%;
        min-height: calc(100vh - 52px);
        padding: 22px 16px 32px;
      }

      .intro,
      .note-block p {
        max-width: none;
      }

      .home-links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline id="myVideo">
    <source src="glitch-assets/webfx2.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="content">
    <h1 id="siteTitle">KRIS PILCHER</h1>

    <p class="intro">
      <span class="roles">Artist and creative technologist</span>

    </p>

    <div class="nav-block">
      <div class="home-links">
        <a href="/XR.html">XR</a>
        <a href="/images.html">IRL</a>
        <a href="/video.html">Video</a>
        <a href="/curator.html">Curatorial</a>
        <a href="/commercial.html">Commercial</a>
        <a href="/blog.html">Research</a>
        <a href="/Dreams.html">Dreams</a>
        <a href="/wishes.html">Wishes</a>
        <a href="/About.html">About</a>
      </div>
    </div>

    <div class="secondary-links">
      <a href="mailto:nemartco@gmail.com">nemartco@gmail.com</a>
      <a href="https://drive.google.com/file/d/1NuRejqf2RLRPHFQHIRfyNw4znq_3u-Q3/view?usp=sharing" target="_blank" rel="noopener noreferrer">CV</a>
    </div>

  </div>
</body>
</html>
