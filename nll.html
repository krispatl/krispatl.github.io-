<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Nightlife Labs</title>
    <style>
        /* Add your CSS styles here */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .banner {
            width: 100%;
            height: 300px; /* Adjust height as needed */
            background: #161616;
            background-size: cover;
            background-position: center;
            text-align: center;
            color: #fff;
            padding-top: 50px; /* Adjust spacing as needed */
        }
        .container {
            display: block;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .team-member {
            margin-bottom: 40px;
        }
        .team-member img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="banner">
    <h1>Welcome to Nightlife Labs</h1>
</div>

<div class="container">
    <h2>About Nightlife Labs</h2>
    <p>A mixed-reality nightclub concept.</p>

</div>

</body>
</html>
